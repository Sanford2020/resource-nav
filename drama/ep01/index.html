<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="《挂号单上是我的名字》第 1 集 — AI 生成短剧样片" />
  <meta name="color-scheme" content="light" />
  <title>《挂号单上是我的名字》第 1 集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3ead8;
      --ink: #12100e;
      --ink-muted: #6b6458;
      --rule-light: rgba(18, 16, 14, 0.18);
      --accent-amber: #d97706;
      --ai-label-bg: #fde68a;
      --ai-label-border: #b45309;
    }

  * {
    box-sizing: border-box;
    margin: 0;
  }

  body {
    min-height: 100vh;
    font-family: "DM Sans", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(90deg, var(--rule-light) 1px, transparent 1px),
      linear-gradient(var(--rule-light) 1px, transparent 1px);
    background-size: 24px 24px;
    line-height: 1.55;
    padding: 1.25rem;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  header {
    text-align: center;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-weight: 700;
    font-size: clamp(1.25rem, 5vw, 1.5rem);
    line-height: 1.35;
    margin-bottom: 0.75rem;
  }

  .ai-badge {
    display: inline-block;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--ai-label-border);
    background: var(--ai-label-bg);
    border: 1px solid rgba(180, 83, 9, 0.35);
    border-radius: 6px;
    padding: 0.35rem 0.75rem;
    max-width: 22rem;
    line-height: 1.45;
  }

  .player-shell {
    background: #12100e;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(18, 16, 14, 0.18);
  }

  video {
    display: block;
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: min(78vh, 720px);
    background: #000;
    object-fit: contain;
  }

  .hint {
    margin-top: 1rem;
    text-align: center;
    font-size: 0.875rem;
    color: var(--ink-muted);
  }

  .hint a {
    color: var(--accent-amber);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>《挂号单上是我的名字》<br />第 1 集</h1>
      <p class="ai-badge" role="note">
        本内容由人工智能（AI）参与生成，仅供创作样片观看。
      </p>
    </header>

    <div class="player-shell">
      <video
        controls
        playsinline
        preload="metadata"
        poster=""
        width="540"
        height="960"
        aria-label="《挂号单上是我的名字》第 1 集 视频"
      >
        <source src="ep01.mp4" type="video/mp4" />
        您的浏览器不支持 HTML5 视频播放，请换用较新的浏览器。
      </video>
    </div>

    <p class="hint">
      <a href="../../index.html">返回资源导航首页</a>
    </p>
  </main>
</body>
</html>
